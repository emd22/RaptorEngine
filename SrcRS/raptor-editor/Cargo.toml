[package]
name = "raptor-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
gui = ["dep:wxdragon", "dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-quartz-core"]

[dependencies]
raptor-math = { path = "../raptor-math" }
raptor-brush = { path = "../raptor-brush" }
wxdragon = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSWindow", "NSView", "NSEvent", "NSCursor", "NSResponder"] }
objc2-foundation = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", optional = true, features = ["CAMetalLayer", "CALayer"] }

[lints]
workspace = true
