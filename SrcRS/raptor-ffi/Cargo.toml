[package]
name = "raptor-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
raptor-gpu = { path = "../raptor-gpu" }
raptor-brush = { path = "../raptor-brush" }
raptor-config = { path = "../raptor-config" }
raptor-math = { path = "../raptor-math" }
raptor-mesh = { path = "../raptor-mesh" }
raptor-render = { path = "../raptor-render" }
raptor-shader = { path = "../raptor-shader" }

[lints]
workspace = true
